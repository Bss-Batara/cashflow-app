name: Deploy Apps Script backend
"on":
  push:
    branches:
      - main
    paths:
      - backend/apps-script/**
      - .github/workflows/deploy-apps-script.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
      CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Skip deployment when credentials are not configured
        if: env.CLASP_SCRIPT_ID == '' || env.CLASP_DEPLOYMENT_ID == '' || env.CLASP_CREDENTIALS == ''
        run: echo "Apps Script deployment skipped because repository secrets are incomplete."
      - name: Configure clasp
        if: env.CLASP_SCRIPT_ID != '' && env.CLASP_DEPLOYMENT_ID != '' && env.CLASP_CREDENTIALS != ''
        shell: bash
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          echo "{"scriptId":"$CLASP_SCRIPT_ID","rootDir":"backend/apps-script"}" > .clasp.json
      - name: Push Apps Script source
        if: env.CLASP_SCRIPT_ID != '' && env.CLASP_DEPLOYMENT_ID != '' && env.CLASP_CREDENTIALS != ''
        run: npx clasp push --force
      - name: Update web app deployment
        if: env.CLASP_SCRIPT_ID != '' && env.CLASP_DEPLOYMENT_ID != '' && env.CLASP_CREDENTIALS != ''
        run: npx clasp deploy --deploymentId "$CLASP_DEPLOYMENT_ID" --description "Automated deployment $GITHUB_SHA"
