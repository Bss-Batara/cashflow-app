name: Validate CashFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # .js: node --check langsung.
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          # .gs TIDAK dikenali `node --check` (ERR_UNKNOWN_FILE_EXTENSION), jadi
          # diparse dengan vm.Script — tetap memvalidasi sintaks, tanpa false-fail.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const vm = require("vm");
            const dir = "backend/apps-script";
            const files = fs.readdirSync(dir).filter((name) => name.endsWith(".gs")).sort();
            let failed = 0;
            for (const file of files) {
              try {
                new vm.Script(fs.readFileSync(path.join(dir, file), "utf8"), { filename: file });
              } catch (error) {
                failed += 1;
                console.error("SYNTAX ERROR " + file + ": " + error.message);
              }
            }
            console.log("Apps Script: " + (files.length - failed) + "/" + files.length + " berkas .gs lolos parse");
            if (failed > 0) process.exit(1);
          '

      - name: Validate required deployment files
        shell: bash
        run: |
          test -f index.html
          test -f backend/apps-script/appsscript.json
          test -f js/api.js
          test -f js/store.js
          test -f backend/apps-script/Investments.gs
