<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rp100k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with Rp 100.000 Crimson Red -->
  <rect width="512" height="512" rx="128" fill="url(#rp100k)"/>
  
  <!-- Banknote Card Motif in Clean White -->
  <rect x="80" y="140" width="352" height="232" rx="28" fill="#ffffff" stroke="#fecdd3" stroke-width="4"/>
  
  <!-- Security Thread Strip (Gold) -->
  <line x1="160" y1="140" x2="160" y2="372" stroke="url(#goldRibbon)" stroke-width="8" stroke-dasharray="14 10"/>
  
  <!-- Rp Symbol & 100k in Red -->
  <text x="210" y="240" font-family="-apple-system, sans-serif" font-size="78" font-weight="900" fill="#be123c" letter-spacing="-2">Rp</text>
  <text x="212" y="310" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#9f1239" letter-spacing="1">100.000</text>
  
  <!-- Growth upward dynamic curve -->
  <path d="M120 330 Q 220 320 320 220 L370 170" stroke="#059669" stroke-width="14" stroke-linecap="round" fill="none"/>
  <polyline points="330,170 370,170 370,210" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
